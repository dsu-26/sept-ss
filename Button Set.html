<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Button Pseudo-Class Demo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atomic+Age&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 60px;
    }

    section {
      margin-bottom: 40px;
    }

    h2,
    p {
      color: #E66363;
      font-size: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: bold;
    }

    .button {
      border-radius: 40px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 3px;
      margin: 5px 15px 5px 0;
      min-width: 120px;
      padding: 20px 10px;
      text-transform: lowercase;
      cursor: progress;
      text-decoration: rgb(red green blue / alpha);
      display: inline-block;
      font-family: "Atomic Age", system-ui;

    }
    .sm-button{
      font-size: .7em;
      min-width: 75px;
    }
    .primary {
      background: #BD1917;
      border: 2px solid #BD1917;
      color: white;
    }

    .primary:hover {
      background: #F02321;
      border-color: #F02321;
    }

    .primary:focus {
      box-shadow: inset 0 0 0 3px #E66363;
      outline: none;
    }

    .primary:active {
      background: #901516;
      border-color: #901516;
      color: #BD1917;
    }

    .primary:disabled {
      background: #C19998;
      border-color: #C19998;
      color: #e8f3f0;
      cursor: not-allowed;
    }

    .secondary {
      background: white;
      border: 2px solid #BD1917;
      color: #BD1917;
    }

    .secondary:hover {
      border-color: #F02321;
      color: #F02321;
    }

    .secondary:focus {
      box-shadow: 0 0 0 3px #E66363, inset 0 0 0 3px white;
      outline: wheat;
    }

    .secondary:active {
      border-color: #901516;
      color: #BD1917;
    }

    .secondary:disabled {
      border-color: #C19998;
      color: #C19998;
      cursor: not-allowed;
    }

    .tertiary {
      color: #BD1917;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
    }

    .tertiary:hover {
      color: #F02321;
    }

    .tertiary:focus {
      outline: none;
      text-decoration: underline;
      text-decoration-thickness: 3px;
      text-underline-offset: 4px;
    }

    .tertiary:active {
      color: #901516;
    }

    .tertiary-disabled {
      color: #C19998;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: not-allowed;
    }
    .banana{
      cursor: url('bananas.png'), all-scroll;
    }

  </style>
</head>
<body>
  <section>
    <h2>Primary Buttons</h2>
    <button class="button primary">Primary</button> <button class="button primary" disabled>Disabled</button>
  </section>

  <section>
    <h2>Secondary Buttons</h2>
    <button class="button secondary">Secondary</button> <button class="button secondary" disabled>Disabled</button>
  </section>

  <section>
    <h2>Tertiary Button</h2>
    <a class="tertiary" href="#">Normal Text Link</a>&nbsp;&nbsp;<a class="tertiary-disabled">Disabled Text Link</a>
  </section>
  <section>
    <br>
    <h2>Bonus: Custom cursors</h2>
    <button class="button sm-button banana">Bananas!</button>
  </section>
  <section>
      <a href="https://www.figma.com/design/xfuudhg7A0SNryMjmRxtd4/Bombastic-Button-Set---Shea?node-id=1-40&t=Msg7OaQmD6lBKksr-1" class="button primary">View design file</a><a href="./index.html" class="tertiary">Home</a>
    </section>
  </body>
</html>
